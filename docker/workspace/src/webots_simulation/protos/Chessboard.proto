#VRML_SIM R2025a utf8

PROTO Chessboard [
  field SFVec3f translation 0 0 0.02
  field SFRotation rotation 0 0 1 0
  field SFVec3f size 0.256 0.256 0.0001
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name "chessboard"

    children [
      Shape {
        appearance PBRAppearance {
          baseColor 1 1 1
          roughness 1
          metalness 0

          baseColorMap ImageTexture {
            url [
              "./textures/chessboard_9x7_256x256.png"
            ]
          }
        }

        geometry Box {
          size IS size
        }
      }
    ]
  }
}