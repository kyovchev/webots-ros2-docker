#VRML_SIM R2025a utf8

PROTO BlueHexagon [
  field SFVec3f    translation 0 0 0.025
  field SFRotation rotation 0 0 1 0
  field SFString   name "blue_hexagon"
  field SFFloat    radius 0.02
  field SFFloat    height 0.01
  field SFFloat    mass 0.01
  field SFColor    color 0.0 0.2 1.0
]
{
  Solid {
    translation IS translation
    rotation IS rotation
    name IS name

    children [
      Shape {
        appearance PBRAppearance {
          baseColor IS color
          roughness 0.35
          metalness 0
        }

        geometry Cylinder {
          radius IS radius
          height IS height
          subdivision 6
        }
      }
    ]

    boundingObject Cylinder {
      radius IS radius
      height IS height
      subdivision 6
    }

    physics Physics {
      density -1
      mass IS mass
    }
  }
}
